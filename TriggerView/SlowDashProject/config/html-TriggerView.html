<!-- <form sd-value="LogicFilter"> -->
<form>
<div style="margin-bottom:0.5em">
    Signals:<br>
    <input type="text" name="trigger-signals" sd-value="LogicFilter['trigger-signals']" style="width:95%" aria-label="Signals">
    <input type="submit" name="set_signals" value="Set">
  </div>
<div style="margin-bottom:0.5em">
    Expression:<br>
    <input type="text" name="trigger-expression" sd-value="LogicFilter['trigger-expression']" style="width:75%" aria-label="Expression">
    <input type="submit" name="set_expression" value="Set">
  </div>
  <div>
    Width:
    <input type="number" name="trigger-width" sd-value="LogicFilter['trigger-width']" step="1" aria-label="Width">
    <input type="submit" name="set_width" value="Set">
  </div>
</form>
